name: Build EXE and APK Releases

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build
      - run: pnpm electron-build-win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-electron/Copo-Gaming-*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build
      - run: pnpm electron-build-mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist-electron/Copo-Gaming-*.dmg
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build
      - run: pnpm electron-build-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-electron/Copo-Gaming-*.AppImage
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    env:
      SKIP_JDK_VERSION_CHECK: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: 1

      - run: pnpm install
      - run: pnpm build
      - run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
