name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      SKIP_JDK_VERSION_CHECK: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java version
        run: java -version

      - uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: 1

      - name: Install dependencies
        run: pnpm install

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK files
        run: |
          echo "=== Looking for APK files ==="
          find android -name "*.apk" -type f -exec ls -lh {} \;
          echo "=== APK locations ==="
          find android -name "*.apk" -type f

      - name: List build outputs
        run: |
          echo "=== Android build output directory ==="
          ls -la android/app/build/outputs/apk/release/ || echo "Directory not found"

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Copo-Gaming-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload all APKs as fallback
        uses: actions/upload-artifact@v4
        with:
          name: All-APK-Files
          path: android/app/build/outputs/apk/
          if-no-files-found: warn
          retention-days: 30
